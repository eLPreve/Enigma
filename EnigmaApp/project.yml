name: Enigma
options:
  bundleIdPrefix: com.elpreve
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  EnigmaCore:
    path: ../EnigmaIOS
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Enigma:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: EnigmaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elpreve.enigma
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Enigma
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
schemes:
  Enigma:
    build:
      targets:
        Enigma: all
    run:
      config: Debug
